[project]
name = "core"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = [
    "protobuf>=7.36.1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["generated"]

[tool.pyright]
include = ["tests"]
extraPaths = ["generated"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.ruff]
target-version = "py314"
extend-exclude = ["generated"]
