[project]
name = "core"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = [
    "protobuf>=7.36.1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
pythonpath = ["generated", "modules"]
markers = ["transport: cross-language proof requiring the native build to already exist (run via check-transport, not check-python)"]

[tool.pyright]
include = ["tests", "modules", "main.py"]
extraPaths = ["generated", "modules"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.ruff]
target-version = "py314"
extend-exclude = ["generated"]
