[project]
name = "corytm"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = [
    "groq>=1.7.0",
    "protobuf>=7.36.1",
    "pydantic>=2.13.5",
]

[project.scripts]
corytm = "corytm.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/corytm"]
markers = [
    "transport: cross-language proof requiring the native build to already exist (run via check-transport, not check-python)",
    "live_llm: calls a real hosted model provider over the network; requires a real API key and is skipped automatically without one",
]

[tool.pyright]
include = ["tests", "src"]
exclude = ["src/corytm/generated"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.ruff]
target-version = "py314"
extend-exclude = ["src/corytm/generated"]

[tool.ruff.lint]
extend-select = ["D100", "D101", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D104"]
"src/corytm/**/test_*.py" = ["D100", "D101", "D104"]
"sidecar_proof.py" = ["D100"]
