syntax = "proto3";

package corytm.schemas.project;

message AudioClip {
  uint32 schema_version = 1;
  string id = 2;
  double start_seconds = 3;
  double duration_seconds = 4;
}

message AudioTrack {
  uint32 schema_version = 1;
  string id = 2;
  repeated AudioClip clips = 3;
}

message Project {
  uint32 schema_version = 1;
  string id = 2;
  repeated AudioTrack tracks = 3;
}

message MaterializeProjectCommand {
  uint32 schema_version = 1;
  Project project = 2;
}

message ProjectRenderedEvent {
  uint32 schema_version = 1;
  string project_id = 2;
  string rendered_file_path = 3;
  uint64 rendered_sample_count = 4;
  double peak_amplitude = 5;
}

message MoveClipCommand {
  uint32 schema_version = 1;
  string project_id = 2;
  string track_id = 3;
  string clip_id = 4;
  double new_start_seconds = 5;
}

message ClipMovedEvent {
  uint32 schema_version = 1;
  string project_id = 2;
  string track_id = 3;
  string clip_id = 4;
  double start_seconds = 5;
  bool moved = 6;
  string rendered_file_path = 7;
  uint64 rendered_sample_count = 8;
  double peak_amplitude = 9;
}

message CreateProjectCommand {
  uint32 schema_version = 1;
}

message ProjectCreatedEvent {
  uint32 schema_version = 1;
  string project_id = 2;
}

message SaveProjectCommand {
  uint32 schema_version = 1;
  string file_path = 2;
}

message ProjectSavedEvent {
  uint32 schema_version = 1;
  string project_id = 2;
  string file_path = 3;
}

message OpenProjectCommand {
  uint32 schema_version = 1;
  string file_path = 2;
}

message ProjectOpenedEvent {
  uint32 schema_version = 1;
  string project_id = 2;
  string file_path = 3;
  uint32 track_count = 4;
  uint64 rendered_sample_count = 5;
  double peak_amplitude = 6;
}

message AddAudioTrackCommand {
  uint32 schema_version = 1;
}

message AudioTrackAddedEvent {
  uint32 schema_version = 1;
  string project_id = 2;
  string track_id = 3;
  uint32 track_count = 4;
}

message AddAudioClipCommand {
  uint32 schema_version = 1;
  string track_id = 2;
  double duration_seconds = 3;
}

message AudioClipAddedEvent {
  uint32 schema_version = 1;
  string project_id = 2;
  string track_id = 3;
  string clip_id = 4;
  double start_seconds = 5;
  double duration_seconds = 6;
  string rendered_file_path = 7;
  uint64 rendered_sample_count = 8;
  double peak_amplitude = 9;
}

message PlayCommand {
  uint32 schema_version = 1;
  Project project = 2;
}

message PlaybackStartedEvent {
  uint32 schema_version = 1;
  string project_id = 2;
  bool device_opened = 3;
}

message StopCommand {
  uint32 schema_version = 1;
}

message PlaybackStoppedEvent {
  uint32 schema_version = 1;
  string project_id = 2;
  double final_position_seconds = 3;
}

message GetPlaybackPositionCommand {
  uint32 schema_version = 1;
}

message PlaybackPositionEvent {
  uint32 schema_version = 1;
  bool is_playing = 2;
  double position_seconds = 3;
}

message PrepareDeviceCommand {
  uint32 schema_version = 1;
}

message DevicePreparedEvent {
  uint32 schema_version = 1;
  bool device_opened = 2;
}

message Command {
  oneof command {
    MaterializeProjectCommand materialize = 1;
    MoveClipCommand move_clip = 2;
    CreateProjectCommand create_project = 3;
    SaveProjectCommand save_project = 4;
    OpenProjectCommand open_project = 5;
    AddAudioTrackCommand add_track = 6;
    AddAudioClipCommand add_clip = 7;
    PlayCommand play = 8;
    StopCommand stop = 9;
    GetPlaybackPositionCommand get_playback_position = 10;
    PrepareDeviceCommand prepare_device = 11;
  }
}

message Event {
  oneof event {
    ProjectRenderedEvent project_rendered = 1;
    ClipMovedEvent clip_moved = 2;
    ProjectCreatedEvent project_created = 3;
    ProjectSavedEvent project_saved = 4;
    ProjectOpenedEvent project_opened = 5;
    AudioTrackAddedEvent track_added = 6;
    AudioClipAddedEvent clip_added = 7;
    PlaybackStartedEvent playback_started = 8;
    PlaybackStoppedEvent playback_stopped = 9;
    PlaybackPositionEvent playback_position = 10;
    DevicePreparedEvent device_prepared = 11;
  }
}
